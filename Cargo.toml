[package]
name = "omaxy"
version = "0.1.0"
edition = "2021"
description = "Open Xray proxy client for Omarchy/Hyprland: TUN daemon (happd-wire-compatible), CLI, panel module"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
libc = "0.2"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.7"

[profile.release]
lto = true
strip = true
