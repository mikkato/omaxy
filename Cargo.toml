[package]
name = "omaxy"
version = "0.1.0"
edition = "2021"
description = "Open Xray proxy client for Omarchy/Hyprland: TUN daemon (happd-wire-compatible), CLI, panel module"
license = "MIT"

[[bin]]
name = "omaxy-gui"
path = "src/bin/omaxy_gui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
libc = "0.2"
ureq = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.7"
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-winit-femtovg",
    "compat-1-2",
] }

[build-dependencies]
slint-build = "1"

[profile.release]
lto = true
strip = true
